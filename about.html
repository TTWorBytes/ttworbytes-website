<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Essential document settings -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Change these three items on every page -->
    <title>About Neil Amess | Author and Game Developer</title>

    <meta
        name="description"
        content="Learn about Neil Amess, the author behind the This Is My series and the Ke'Valien Trilogy, and the creator of TTWORBYTES games."

        href="https://www.ttworbytes.com/PAGE-ADDRESS.html"
    >

    <meta name="robots" content="index, follow">

    <link
        rel="icon"
        type="image/png"

    <link

        name="twitter:description"
